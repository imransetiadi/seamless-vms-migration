# Added by the Make targets on a Linux machine's own Docker Engine only (SEAMLESS_DOCKER_CONTEXT=default, SDD 17.1):
# that engine defines no host.docker.internal, the host of the default agentmemory URL (compose-init.sh). Colima
# and Docker Desktop resolve the name to the developer's machine themselves; there host-gateway would be their VM.
services:
  seamless:
    extra_hosts:
      - "host.docker.internal:host-gateway"
