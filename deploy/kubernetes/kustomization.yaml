# Seamless Migrate on vanilla Kubernetes 1.28+ (SDD 17): the OpenShift manifests with what OpenShift
# provides by itself replaced by portable equivalents.
#
#   * Route              -> Ingress (ingress.yaml; ingress-nginx annotations, TLS secret seamless-tls)
#   * restricted SCC     -> explicit runAsUser/fsGroup (OpenShift injects them; Kubernetes does not)
#   * openshift-dns      -> kube-system CoreDNS (k8s-app: kube-dns)
#   * router namespace   -> the ingress controller's namespace (ingress-nginx)
#   * 172.30.0.1         -> 10.96.0.1, the usual kubernetes Service IP (kubectl get svc kubernetes -n default)
#   * OpenShift pod/service networks in the egress policies -> the cluster's (kubeadm defaults below)
#   * registry.redhat.io/rhel9/postgresql-16 -> quay.io/sclorg/postgresql-16-c9s, pinned by digest (same image interface,
#     public; keep the Red Hat image when you have a pull secret for registry.redhat.io)
#
# Deploy:
#   1. Build and push the image (repository root; `make dashboard-build` first):
#        docker build -f seamless/Containerfile -t <registry>/seamless-migrate:0.1.0 .   # or: podman build …
#        docker push <registry>/seamless-migrate:0.1.0
#   2. Set newName/newTag (or a digest) for seamless-migrate below, the Ingress host in ingress.yaml and,
#      if your ingress controller or DNS run elsewhere, the namespaces in the patches.
#   3. Create the Secrets of ../openshift/secret-example.yaml (seamless-db, seamless-tokens; optional
#      seamless-clouds, seamless-vmware, seamless-ai) and the TLS secret seamless-tls in the namespace.
#   4. kubectl apply -k deploy/kubernetes
#      kubectl -n seamless-migrate rollout status deploy/seamless
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../openshift
  - ingress.yaml

images:
  - name: image-registry.openshift-image-registry.svc:5000/seamless-migrate/seamless-migrate
    newName: registry.example.com/seamless/seamless-migrate
    newTag: 0.1.0
  - name: registry.redhat.io/rhel9/postgresql-16
    newName: quay.io/sclorg/postgresql-16-c9s
    # pinned (multi-arch index of :latest on 2026-10-09); refresh with
    #   docker buildx imagetools inspect quay.io/sclorg/postgresql-16-c9s:latest
    digest: sha256:beaf7f16890b05aac31197a9e0bbba0697cb93da34a60a47ad8134bb2c9d6911

patches:
  # no Routes outside OpenShift
  - target:
      group: route.openshift.io
      kind: Route
      name: seamless
    patch: |
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: seamless
  # the UID the image is built for (USER 1001, files owned 1001:0) and a group that owns the volumes
  - target:
      kind: Deployment
      name: seamless
    patch: |
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 0
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 0
  # postgres in the sclorg/RHEL images runs as UID 26
  - target:
      kind: StatefulSet
      name: seamless-postgres
    patch: |
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 26
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 26
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 26
  - target:
      kind: NetworkPolicy
      name: seamless-allow-dns-egress
    patch: |
      - op: replace
        path: /spec/egress/0/to
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
  - target:
      kind: NetworkPolicy
      name: seamless-allow-ingress-from-router
    patch: |
      - op: replace
        path: /spec/ingress/0/from
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
  # ADJUST to your cluster: the pod and service networks below are the kubeadm/kind defaults
  # (kubectl cluster-info dump | grep -m2 -E -- '--(cluster-cidr|service-cluster-ip-range)'); k3s uses
  # 10.42.0.0/16 and 10.43.0.0/16. Calico's default pool 192.168.0.0/16 often overlaps lab networks where
  # the clouds live — except it only when no OpenStack/vCenter endpoint or conversion host is in it.
  # Outbound to clouds and conversion hosts, but never to a pod or Service of this cluster (and not to
  # OpenShift's ranges, which are ordinary private addresses here).
  - target:
      kind: NetworkPolicy
      name: seamless-allow-egress-external
    patch: |
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/except
        value:
          - 10.244.0.0/16
          - 10.96.0.0/12
          - 169.254.0.0/16
  # 6443 is the API server on the control-plane node addresses (after kube-proxy DNAT); keep pods and
  # Services out. TIGHTEN BEFORE PRODUCTION: set the cidr to those nodes (kubectl get endpoints kubernetes).
  - target:
      kind: NetworkPolicy
      name: seamless-allow-egress-kube-api
    patch: |
      - op: add
        path: /spec/egress/0/to/0/ipBlock/except
        value:
          - 10.244.0.0/16
          - 10.96.0.0/12
          - 169.254.0.0/16
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 10.96.0.1/32
