# The relay (SDD 25.6, 25.9): a follower relays the API and the event stream to the leader's pod on its API port, in
# plain HTTP inside the namespace, the caller's bearer token included. The control plane's pods reach each other there,
# in and out, and nothing else between them: default-deny-all and ../networkpolicy.yaml stay as they are, and its
# external egress keeps the pod network out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seamless-allow-relay
  labels:
    app.kubernetes.io/part-of: seamless-migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seamless
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seamless
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seamless
      ports:
        - protocol: TCP
          port: 8080
