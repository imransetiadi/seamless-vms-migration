# Dashboard-entered provider credentials (SDD 13.3, 17): the control plane writes them as Secrets named
# seamless-provider-<id>[-ssh] in this namespace and reads them back through the API. The Role is
# namespaced; Kubernetes cannot restrict "create" to a name pattern, so keep this namespace dedicated to
# Seamless Migrate (Security.md R-15). Remove this file, the token mount and SEAMLESS_SECRET_STORE from
# deployment.yaml to manage credentials only through clouds.yaml / mounted Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seamless-secret-store
  labels:
    app.kubernetes.io/name: seamless
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seamless-secret-store
  labels:
    app.kubernetes.io/name: seamless
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seamless-secret-store
subjects:
  - kind: ServiceAccount
    name: seamless
