# The control plane talks to OpenStack/vCenter APIs and PostgreSQL, and — for credentials entered in
# the dashboard (SEAMLESS_SECRET_STORE=kubernetes, SDD 13.3) — to the Kubernetes API for Secrets in
# its own namespace only (secret-store-rbac.yaml). The token is mounted in deployment.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seamless
  labels:
    app.kubernetes.io/name: seamless
    app.kubernetes.io/component: control-plane
automountServiceAccountToken: false
