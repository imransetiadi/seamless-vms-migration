# The control plane talks to OpenStack/vCenter APIs and PostgreSQL only; it never needs the
# Kubernetes API, so no API token is mounted (SDD 13, Security.md 9).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seamless
  labels:
    app.kubernetes.io/name: seamless
    app.kubernetes.io/component: control-plane
automountServiceAccountToken: false
