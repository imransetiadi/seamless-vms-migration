# EXAMPLE ONLY - every value below is a placeholder. This file is intentionally NOT listed in
# kustomization.yaml: never apply it unchanged and never commit real values (SDD 13.3, Security.md 7).
#
# Preferred: do not keep secrets in files at all. Use your cluster's secret management (External Secrets,
# Vault, sealed/encrypted secrets, GitOps secret plugins) to create the Secrets named below, or create them
# imperatively from values that never touch disk:
#
#   PGPW=$(openssl rand -hex 24)
#   oc -n seamless-migrate create secret generic seamless-db \
#     --from-literal=POSTGRES_USER=seamless --from-literal=POSTGRES_DB=seamless \
#     --from-literal=POSTGRES_PASSWORD="$PGPW" \
#     --from-literal=SEAMLESS_DB_URL="postgresql+psycopg://seamless:${PGPW}@seamless-postgres:5432/seamless"
#
#   TOKEN="smg_$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
#   echo "admin API token (shown once, store it in a password manager): $TOKEN"
#   HASH=$(printf %s "$TOKEN" | shasum -a 256 | cut -d' ' -f1)
#   oc -n seamless-migrate create secret generic seamless-tokens \
#     --from-literal=tokens.yaml="$(printf 'tokens:\n  - name: admin\n    role: admin\n    sha256: %s\n' "$HASH")"
#
#   oc -n seamless-migrate create secret generic seamless-clouds --from-file=clouds.yaml=./clouds.yaml \
#     --from-file=rhosp17-ca.pem=./rhosp17-ca.pem
#
# Keys expected by deployment.yaml / postgres-statefulset.yaml are documented per Secret below.
---
apiVersion: v1
kind: Secret
metadata:
  name: seamless-db
  labels:
    app.kubernetes.io/part-of: seamless-migrate
type: Opaque
stringData:
  POSTGRES_USER: seamless
  POSTGRES_DB: seamless
  POSTGRES_PASSWORD: CHANGE-ME-generate-with-openssl-rand-hex-24
  # must contain the same password; use ?sslmode=verify-full&sslrootcert=... for a TLS-enabled server
  SEAMLESS_DB_URL: postgresql+psycopg://seamless:CHANGE-ME-generate-with-openssl-rand-hex-24@seamless-postgres:5432/seamless
---
apiVersion: v1
kind: Secret
metadata:
  name: seamless-tokens
  labels:
    app.kubernetes.io/part-of: seamless-migrate
type: Opaque
stringData:
  # `seamless token create --name NAME --role {viewer,operator,approver,admin}` prints a token once plus
  # this YAML entry. Only the SHA-256 of a token is stored here.
  tokens.yaml: |
    tokens:
      - name: admin
        role: admin
        sha256: "CHANGE-ME-sha256-hex-of-the-admin-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: seamless-clouds
  labels:
    app.kubernetes.io/part-of: seamless-migrate
type: Opaque
stringData:
  # Provider.cloud selects an entry by name (SDD 13.3). Prefer Keystone application credentials:
  # scoped to one project, revocable without changing a password.
  clouds.yaml: |
    clouds:
      rhosp17:
        auth_type: v3applicationcredential
        auth:
          auth_url: https://CHANGE-ME-keystone.example.com:13000/v3
          application_credential_id: CHANGE-ME
          application_credential_secret: CHANGE-ME
        region_name: regionOne
        interface: public
        verify: true
        cacert: /etc/seamless/clouds/rhosp17-ca.pem
      rhoso18:
        auth_type: v3applicationcredential
        auth:
          auth_url: https://CHANGE-ME-keystone-public.apps.example.com/v3
          application_credential_id: CHANGE-ME
          application_credential_secret: CHANGE-ME
        region_name: regionOne
        interface: public
        verify: true
        cacert: /etc/seamless/clouds/rhoso18-ca.pem
  # CA bundles referenced above (paste the PEM certificates of your clouds' CAs; certificates, not keys)
  rhosp17-ca.pem: "CHANGE-ME-paste-CA-bundle"
  rhoso18-ca.pem: "CHANGE-ME-paste-CA-bundle"
---
apiVersion: v1
kind: Secret
metadata:
  name: seamless-vmware
  labels:
    app.kubernetes.io/part-of: seamless-migrate
type: Opaque
stringData:
  # Mounted as /var/run/secrets/seamless/dc2/{username,password} for a provider with credentials_secret: dc2
  # (uncomment and adapt the `items` example under the "vmware" volume of deployment.yaml: one pair per credential).
  dc2-username: CHANGE-ME-vcenter-service-account@vsphere.local
  dc2-password: CHANGE-ME
  # SSH private key of an existing conversion host (ConversionHostConfig.ssh_key_secret: conv-key), mounted as
  # /var/run/secrets/seamless/conv-key/private_key through the same `items` mapping. Never commit a real key.
  conv-key-private-key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    CHANGE-ME
    -----END OPENSSH PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: seamless-ai
  labels:
    app.kubernetes.io/part-of: seamless-migrate
type: Opaque
stringData:
  # The whole Secret is optional, and so is each key - delete the ones you do not use.
  # TYPESAFE_API_KEY only with SEAMLESS_JEV_MODE=stdio; SEAMLESS_JEV_TOKEN only with SEAMLESS_JEV_MODE=http;
  # SEAMLESS_MEMORY_SECRET only when your agentmemory server requires a bearer secret.
  TYPESAFE_API_KEY: CHANGE-ME-jev-provider-key
  SEAMLESS_JEV_TOKEN: CHANGE-ME-jev-mcp-bearer-token
  SEAMLESS_MEMORY_SECRET: CHANGE-ME-agentmemory-secret
