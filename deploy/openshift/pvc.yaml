# Run directories ({data_dir}/plans/<plan>/migrations/<migration>/, SDD 7.2) and logs. Secrets land here too
# (SDD 7.2, 25.1, 25.9): a run's secrets.yml, clouds.yaml and Ceph files, 0600, while its playbook runs - deleted
# when the run ends; a run a crash cut short leaves them until its step runs again - and the installation's
# conversion key in {data_dir}/conversion/. Encrypt the volume at rest, and in transit on a ReadWriteMany class.
# ReadWriteOnce, which every cluster serves; the HA component (ha/) asks for ReadWriteMany, since its two replicas
# share the volume from two nodes (SDD 17, 25.7).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seamless-data
  labels:
    app.kubernetes.io/name: seamless
    app.kubernetes.io/component: control-plane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: <your RWO class>   # omit to use the cluster default
