# Modified by the Seamless Migrate project, 2026.
namespace: os_migrate
name: os_migrate
version: 1.1.0
readme: README.md
authors:
  - Jiri Stransky <jistr@redhat.com>
  - Carlos Camacho <ccamacho@redhat.com>
  - Ryan Brady <rbrady@redhat.com>
  - Sagi Shnaidman <sshnaidm@redhat.com>
  - Matthew Arnold <marnold@redhat.com>
  - Adrian Brown <adrbrown@redhat.com>
  # Keep this at the bottom
  - os-migrate (https://github.com/os-migrate)
description: >-
  OpenStack tenant migration tooling, with warm (snapshot pre-copy and
  chunk delta sync) workload migration to Red Hat OpenStack Services on
  OpenShift (RHOSO) 18.0
license:
  - Apache-2.0
tags:
  - openstack
  - migrations
  - cloud
repository: "https://github.com/os-migrate/os-migrate"
homepage: "https://github.com/os-migrate/os-migrate"
issues: "https://github.com/os-migrate/os-migrate/issues"
build_ignore:
  - .venv
  - .pytest_cache
  - venv
  - .ansible
  - .github
  - .vscode
  - .idea
  - .ansible-lint-ignore
  - aee
  - scripts
  - Makefile
  - CODEOWNERS
  - requirements-build.txt
  - requirements-docs.txt
  - requirements-tests.txt
  - inventory
  - media
  # Seamless Migrate around the collection: the control plane, the dashboard and the deployment
  # ship as container images, and the agent configuration stays in the checkout
  - seamless
  - dashboard
  - deploy
  - .claude
  - .mcp.json
  - CLAUDE.md
  - RELEASING.md
  # audit material and agent plans are not collection documentation (audit D-21)
  - docs/audits
  - docs/advisor
  - docs/superpowers
  - "docs/UI-UX-AUDIT-*.md"
  - "AUDIT-*.md"
  # Everything below mirrors the checkout's .gitignore files, at the depths they name: ansible-galaxy
  # packs files from disk, not from git, and matches each pattern against the path from the
  # collection root, its * spanning "/" (CLAUDE.md §7, Security.md R-26).
  # tests/unit/test_collection_build.py derives a sample from every .gitignore pattern and fails
  # when one would be packed, so a pattern added to a .gitignore file belongs here too.
  # git-ignored local secret files a checkout may hold
  - .env
  - "*/.env"
  - "*.env"
  - ".env.*"
  - "*/.env.*"
  - tokens.yaml
  - "*/tokens.yaml"
  - clouds.yaml
  - "*/clouds.yaml"
  - clouds.yml
  - "*/clouds.yml"
  - secure.yaml
  - "*/secure.yaml"
  - "*.pem"
  - "*.key"
  - secrets
  - "*/secrets"
  # cloud credentials of the e2e and functional playbooks (make generate-auth-files, tests/func)
  - "tests/auth_*.yml"
  - "tests/*/auth_*.yml"
  # the tracks' checkouts (CLAUDE.md §3), agent and check scratch, Finder metadata
  - .worktrees
  - "*/.worktrees"
  - .superpowers
  - "*/.superpowers"
  - .cache
  - "*/.cache"
  - .DS_Store
  - "*/.DS_Store"
  # Python, Ansible and Node build and cache output
  - "*/.venv"
  - "*/venv"
  - "*.py[cod]"
  - "*.egg-info"
  - "*/.pytest_cache"
  - .coverage
  - "*/.coverage"
  - htmlcov
  - "*/htmlcov"
  - .mypy_cache
  - "*/.mypy_cache"
  - .ruff_cache
  - "*/.ruff_cache"
  - "*/.ansible"
  - node_modules
  - "*/node_modules"
  - "*.sqlite3"
  # docs/src/.gitignore: the Sphinx build and the files it generates
  - "*/__pycache__"
  - docs/src/_build
  - docs/src/changelog.rst
  - docs/src/images/plantuml/render
