# Roll the selected workloads back: delete their destination servers (and,
# with os_migrate_rollback_delete_dest_volumes, the destination volumes and
# warm state) and start the source servers again.
- name: Roll back workloads
  hosts: migrator
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ os_migrate_clouds_path | default(os_migrate_data_dir ~ '/clouds.yaml') }}"
  roles:
    - role: os_migrate.os_migrate.import_workloads_warm
      vars:
        import_workloads_warm_action: rollback
