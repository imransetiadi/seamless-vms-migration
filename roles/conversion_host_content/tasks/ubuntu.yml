# Ubuntu 24.04 LTS or later (Seamless Migrate SDD 6.5, 21.6): the copy tools from Ubuntu's
# archive - qemu-img in qemu-utils, nbdcopy in libnbd-bin, virt-sparsify in libguestfs-tools.
- name: Install content
  ansible.builtin.apt:
    name:
      - qemu-utils
      - nbdkit
      - libnbd-bin
      - libguestfs-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

# The Ceph client for the extent queries (Seamless Migrate SDD 6.5, 28.4; plan task CE5): on the
# source conversion host of a plan that tracks extents, from Ubuntu's archive.
- name: Install the Ceph client for the extent queries
  when:
    - os_migrate_conversion_host_ceph_client | bool
    - inventory_hostname == 'os_migrate_conv_src'
  block:
    - name: Install ceph-common
      ansible.builtin.apt:
        name: ceph-common
        state: present
        update_cache: true
        cache_valid_time: 3600
