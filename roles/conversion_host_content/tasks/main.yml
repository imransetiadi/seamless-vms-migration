# Modified by the Seamless Migrate project, 2026.
- name: Conversion host content tasks
  block:
    - name: Display host os
      ansible.builtin.debug:
        msg: >-
          Conversion Host OS is
          {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Running pre content hook
      ansible.builtin.shell: "{{ os_migrate_conversion_host_pre_content_hook }}"
      args:
        executable: /bin/bash
      changed_when: false
      when: os_migrate_conversion_host_pre_content_hook is string

    - name: Fail on a conversion host OS the role cannot set up
      ansible.builtin.fail:
        msg: >-
          The conversion host runs {{ ansible_distribution }}
          {{ ansible_distribution_version }} (ansible_distribution), which
          conversion_host_content cannot set up: it supports RHEL, CentOS Stream 9
          and 10, Rocky Linux 9, AlmaLinux 9 and Ubuntu 24.04 or later
          (Seamless Migrate SDD 6.5).
      when: not os_migrate_conversion_host_content_tasks

    - name: Include the tasks of the conversion host's OS
      ansible.builtin.include_tasks: "{{ os_migrate_conversion_host_content_tasks }}"

    # each run's own link between the conversion hosts (Seamless Migrate SDD 26.6)
    - name: Include sshd's settings for the conversion host link
      ansible.builtin.include_tasks: sshd_link.yml
      when: os_migrate_conversion_link_per_run | default(false) | bool

    - name: Running post content hook
      ansible.builtin.shell: "{{ os_migrate_conversion_host_post_content_hook }}"
      args:
        executable: /bin/bash
      changed_when: false
      when: os_migrate_conversion_host_post_content_hook is string
