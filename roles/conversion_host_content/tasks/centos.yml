- name: Install epel release
  ansible.builtin.package:
    name: epel-release
    state: present

- name: Update all packages
  ansible.builtin.package:
    name: '*'
    state: present
  when: do_yum_update|default(false)|bool

- name: Install content
  ansible.builtin.package:
    name:
      - nbdkit
      - nbdkit-basic-plugins
      - qemu-img
      - guestfs-tools
      - libvirt
    state: present

- name: Start libvirtd
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

# The Ceph client for the extent queries (Seamless Migrate SDD 6.5, 28.4; plan task CE5): on the
# source conversion host of a plan that tracks extents, from the CentOS Storage SIG.
- name: Install the Ceph client for the extent queries
  when:
    - os_migrate_conversion_host_ceph_client | bool
    - inventory_hostname == 'os_migrate_conv_src'
  block:
    - name: Install the CentOS Storage SIG release package
      ansible.builtin.package:
        name: "{{ os_migrate_conversion_host_ceph_repository_centos }}"
        state: present

    - name: Install ceph-common
      ansible.builtin.package:
        name: ceph-common
        state: present
