# Modified by the Seamless Migrate project, 2026.
os_migrate_conversion_keypair_private_path: "{{ os_migrate_data_dir }}/conversion/ssh.key"
os_migrate_timeout: 1800
os_migrate_workload_cleanup_on_failure: true
os_migrate_workload_boot_volume_prefix: os-migrate-
os_migrate_workload_stop_before_migration: false
os_migrate_workloads_data_copy: true
# Keep the serialized volume_type of destination volumes (after mapping it to
# a destination type in the workload data) instead of the destination default.
os_migrate_workloads_preserve_volume_type: false
os_migrate_workloads_filter:
  - regex: .*
# each conversion host's own SSH user, upstream's single one unless set (Seamless Migrate SDD 6.5)
os_migrate_src_conversion_host_ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
os_migrate_dst_conversion_host_ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
# Each run makes its own link between the conversion hosts and removes it when it ends
# (Seamless Migrate SDD 6.4, 26.6): false keeps upstream's static link of the deploy.
os_migrate_conversion_link_per_run: false
# Seconds after a link is made when the source host's sshd stops accepting its key: the step
# timeout of the run, else 7 days.
os_migrate_conversion_link_expiry_s: 604800
