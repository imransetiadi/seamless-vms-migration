# Modified by the Seamless Migrate project, 2026.
---
# Process individual workload - export its disks on its hypervisor

- name: Get workload details
  ansible.builtin.set_fact:
    import_from_hypervisor_instance_id: "{{ workload_item._info.id }}"
    import_from_hypervisor_instance_name: "{{ workload_item.params.name }}"
    import_from_hypervisor_instance_status: "{{ workload_item._info.status }}"
    import_from_hypervisor_host: "{{ workload_item._info.hypervisor_hostname | default('') }}"

- name: Fail if instance is not SHUTOFF
  ansible.builtin.fail:
    msg: >-
      Instance {{ import_from_hypervisor_instance_name }} ({{ import_from_hypervisor_instance_id }})
      must be SHUTOFF. Current status: {{ import_from_hypervisor_instance_status }}
  when: import_from_hypervisor_instance_status != "SHUTOFF"

- name: Fail if hypervisor hostname not in workload data
  ansible.builtin.fail:
    msg: >-
      Hypervisor hostname not found in workload data for
      {{ import_from_hypervisor_instance_name }}. Run export_workloads first.
  when: import_from_hypervisor_host == ''

# A host variable of the hypervisor wins over the global setting, so each
# hypervisor can listen on its own migration-network address.
- name: Choose the address qemu-nbd listens on
  ansible.builtin.set_fact:
    import_from_hypervisor_bind_address: >-
      {{ hostvars[import_from_hypervisor_host]['os_migrate_nbdkit_bind_address']
         | default(os_migrate_nbdkit_bind_address) }}

- name: Refuse a loopback-only export for the tcp protocol
  ansible.builtin.fail:
    msg: >-
      os_migrate_nbdkit_protocol 'tcp' makes the conversion host connect to
      {{ import_from_hypervisor_host }} directly, so qemu-nbd cannot listen on
      {{ import_from_hypervisor_bind_address }} only. Set os_migrate_nbdkit_bind_address
      to the hypervisor's migration-network IP, or use os_migrate_nbdkit_protocol: ssh.
  when:
    - os_migrate_nbdkit_protocol == 'tcp'
    - import_from_hypervisor_bind_address in ['127.0.0.1', '::1', 'localhost']

- name: Choose the address the conversion host connects to
  ansible.builtin.set_fact:
    import_from_hypervisor_nbd_host: >-
      {{ import_from_hypervisor_host
         if import_from_hypervisor_bind_address in ['0.0.0.0', '::']
         else ('[' ~ import_from_hypervisor_bind_address ~ ']')
         if ':' in import_from_hypervisor_bind_address
         else import_from_hypervisor_bind_address }}

- name: Display workload info
  ansible.builtin.debug:
    msg:
      - "Processing: {{ import_from_hypervisor_instance_name }}"
      - "Instance ID: {{ import_from_hypervisor_instance_id }}"
      - "Hypervisor: {{ import_from_hypervisor_host }}"
      - "Status: {{ import_from_hypervisor_instance_status }}"
      - "qemu-nbd listens on: {{ import_from_hypervisor_bind_address }}"

# Logs and PID files of the exports live in a directory only the SSH user
# (and root) can read, instead of predictable names in /tmp.
- name: Create the private qemu-nbd directory on the hypervisor
  ansible.builtin.raw: >-
    sudo install -d -m 0700 -o "$(id -un)" -g "$(id -gn)"
    {{ os_migrate_nbdkit_log_dir | quote }}
  delegate_to: "{{ import_from_hypervisor_host }}"
  changed_when: false

- name: Find all instance disks on hypervisor
  ansible.builtin.raw: >-
    find {{ (os_migrate_nbdkit_nova_instances_dir ~ '/' ~ import_from_hypervisor_instance_id) | quote }}
    -name 'disk*' -type f ! -name '*.info' | sort
  delegate_to: "{{ import_from_hypervisor_host }}"
  register: import_from_hypervisor_disk_paths
  changed_when: false

# find already picks the files by name. The config drive is left out (SDD §6.6): Nova gives
# the destination server its own and records no format for it at spawn, and carried over it
# would be a data disk holding the source's metadata. (Matching the whole path here once
# dropped every disk of an instances path that contained "disk", any character, "info".)
- name: Parse disk paths
  ansible.builtin.set_fact:
    import_from_hypervisor_disks_found: >-
      {{ import_from_hypervisor_disk_paths.stdout_lines | map('trim') | select
         | reject('search', '/disk[.]config$') | list }}

- name: Fail if no disks found
  ansible.builtin.fail:
    msg: >-
      No disks found for instance {{ import_from_hypervisor_instance_id }} on
      hypervisor {{ import_from_hypervisor_host }}
  when: import_from_hypervisor_disks_found | length == 0

- name: Display found disks
  ansible.builtin.debug:
    msg: "Found {{ import_from_hypervisor_disks_found | length }} disk(s): {{ import_from_hypervisor_disks_found }}"

# SDD §6.6: qemu never guesses a disk's format. A raw disk's first block is the guest's: probed,
# a qcow2 header written there would make qemu-nbd (run with sudo) follow a backing file of the
# guest's choosing. Nova records each disk's format in disk.info (one line of JSON, path ->
# format) when it first opens the disk, before the guest runs.
- name: Set the path of the instance's disk.info
  ansible.builtin.set_fact:
    import_from_hypervisor_disk_info_path: >-
      {{ os_migrate_nbdkit_nova_instances_dir ~ '/' ~ import_from_hypervisor_instance_id ~ '/disk.info' }}
    import_from_hypervisor_recorded_formats: {}
    import_from_hypervisor_disk_formats: {}

- name: Read the disk formats Nova recorded
  ansible.builtin.raw: cat {{ import_from_hypervisor_disk_info_path | quote }}
  delegate_to: "{{ import_from_hypervisor_host }}"
  register: import_from_hypervisor_disk_info_file
  changed_when: false
  failed_when: false

- name: Parse the disk formats Nova recorded
  block:
    - name: Parse disk.info
      ansible.builtin.set_fact:
        import_from_hypervisor_recorded_formats: "{{ import_from_hypervisor_disk_info_file.stdout | from_json }}"
      when: import_from_hypervisor_disk_info_file.rc == 0

    - name: Refuse a disk.info that is missing or no map of disk to format
      ansible.builtin.assert:
        that:
          - import_from_hypervisor_disk_info_file.rc == 0
          - import_from_hypervisor_recorded_formats is mapping
          - import_from_hypervisor_recorded_formats | length > 0
        quiet: true
  rescue:
    - name: Refuse the export without the formats Nova recorded
      ansible.builtin.fail:
        msg: >-
          cannot read the disk formats Nova recorded in {{ import_from_hypervisor_disk_info_path }}
          (missing, or not one JSON map of disk path to format): refusing to let qemu guess them

# entries are matched by file name: they name this instance directory's files, and
# os_migrate_nbdkit_nova_instances_dir may spell the directory differently than Nova
- name: Match each disk to the formats Nova recorded for its file name
  ansible.builtin.set_fact:
    import_from_hypervisor_disk_formats: >-
      {{ import_from_hypervisor_disk_formats | combine({
           disk_path: import_from_hypervisor_recorded_formats | dict2items
             | selectattr('key', 'match', '^(.*/)?' ~ (disk_path | basename | regex_escape) ~ '$')
             | map(attribute='value') | unique | list
         }) }}
  loop: "{{ import_from_hypervisor_disks_found }}"
  loop_control:
    loop_var: disk_path
    label: "{{ disk_path | basename }}"

- name: Refuse a disk without one plain format recorded for it
  ansible.builtin.assert:
    that: >-
      (import_from_hypervisor_disk_formats[disk_path] | length == 1)
      and (import_from_hypervisor_disk_formats[disk_path] | first is string)
      and (import_from_hypervisor_disk_formats[disk_path] | first is match('^[a-z0-9]+$'))
    fail_msg: >-
      {{ disk_path }}: {{ import_from_hypervisor_disk_info_path }} records
      {{ import_from_hypervisor_disk_formats[disk_path] | to_json }} as its format, not one
      plain name: refusing to let qemu guess it
    quiet: true
  loop: "{{ import_from_hypervisor_disks_found }}"
  loop_control:
    loop_var: disk_path
    label: "{{ disk_path | basename }}"

- name: Initialize nbdkit disk info list
  ansible.builtin.set_fact:
    import_from_hypervisor_disks: []

- name: Set base port for nbdkit
  ansible.builtin.set_fact:
    import_from_hypervisor_base_port: "{{ workload_item._migration_params.nbdkit_port | default(os_migrate_nbdkit_port) }}"

# Every port this workload's disks would take, judged before its first export: one another disk of this run exports
# on this hypervisor refuses the workload with nothing of it exported (Seamless Migrate SDD 6.6, upstream intake
# UP-04a, review RV44B-05).
- name: Refuse a workload whose ports another disk of this run exports on this hypervisor
  ansible.builtin.assert:
    that: import_from_hypervisor_port_clash | length == 0
    fail_msg: >-
      the disks of {{ import_from_hypervisor_instance_id }} would take port
      {{ import_from_hypervisor_port_clash | join(', port ') }} on {{ import_from_hypervisor_host }},
      which another disk of this run exports: give each workload on one hypervisor its own
      _migration_params.nbdkit_port, its disks' ports apart
    quiet: true
  vars:
    import_from_hypervisor_port_clash: >-
      {{ range(import_from_hypervisor_base_port | int,
               (import_from_hypervisor_base_port | int) + (import_from_hypervisor_disks_found | length))
         | list
         | intersect(import_from_hypervisor_ports_taken[import_from_hypervisor_host] | default([])) }}

# An earlier run's live export of another disk on one of this workload's ports refuses the workload here too, before its
# first export: judged disk by disk in process_disk.yml, it refused only after the workload's earlier disks were
# exported, and those stayed served, recorded nowhere (Seamless Migrate SDD 6.6, reviews RV44B-04, RV45B-01). The test
# is process_disk.yml's: the qemu-nbd its port's PID file names, started with that PID file, serving another disk than
# the one this workload's disk at that port is.
- name: Find an earlier run's export of another disk on this workload's ports
  ansible.builtin.raw: |
    another() {
      port=$1
      disk=$2
      pidfile={{ os_migrate_nbdkit_log_dir | quote }}/qemu-nbd-$port.pid
      sudo test -s "$pidfile" || return 0
      pid=$(sudo cat "$pidfile")
      case "$pid" in ''|*[!0-9]*) return 0 ;; esac
      args=$(ps -ww -p "$pid" -o args= 2>/dev/null)
      case "$args" in
        *qemu-nbd*"--pid-file=$pidfile"*" $disk") ;;
        *qemu-nbd*"--pid-file=$pidfile"*) echo "SERVES ANOTHER DISK: $port $args" ;;
      esac
    }
    {% for disk in import_from_hypervisor_disks_found %}
    another {{ (import_from_hypervisor_base_port | int) + loop.index0 }} {{ disk | quote }}
    {% endfor %}
  delegate_to: "{{ import_from_hypervisor_host }}"
  register: import_from_hypervisor_earlier_exports
  changed_when: false

- name: Refuse a workload whose port an earlier run's export of another disk holds
  ansible.builtin.assert:
    that: import_from_hypervisor_held_ports | length == 0
    fail_msg: >-
      port {{ import_from_hypervisor_held_ports | join(', port ') }} on {{ import_from_hypervisor_host }} serves
      another disk, an earlier run's export whose record still names it, which a disk of
      {{ import_from_hypervisor_instance_id }} would stop: give this workload its own _migration_params.nbdkit_port,
      or stop that export (its PID file {{ os_migrate_nbdkit_log_dir }}/qemu-nbd-<port>.pid) once its VM's import
      is done
    quiet: true
  vars:
    import_from_hypervisor_held_ports: >-
      {{ import_from_hypervisor_earlier_exports.stdout_lines
         | select('match', '^SERVES ANOTHER DISK: [0-9]+ ')
         | map('regex_replace', '^SERVES ANOTHER DISK: ([0-9]+) .*$', '\1')
         | list }}

- name: Process each disk
  ansible.builtin.include_tasks: process_disk.yml
  loop: "{{ import_from_hypervisor_disks_found }}"
  loop_control:
    loop_var: disk_item
    index_var: disk_loop_index
    label: "{{ disk_item | basename }}"
  vars:
    # disk -> /dev/vda; disk.ephN (listed after disk) and others keep their order.
    disk_device_name: >-
      {{ '/dev/vda' if (disk_item | basename) == 'disk'
         else '/dev/vd' ~ 'bcdefghijklmnopqrstuvwxyz'[disk_loop_index - 1
           if 'disk.eph' in (disk_item | basename) else disk_loop_index] }}
    disk_is_bootable: "{{ (disk_item | basename) == 'disk' }}"

- name: Update workload with multiple nbdkit URIs
  os_migrate.os_migrate.update_workload_nbdkit_uris:
    path: "{{ os_migrate_data_dir }}/workloads.yml"
    instance_id: "{{ import_from_hypervisor_instance_id }}"
    nbdkit_disks: "{{ import_from_hypervisor_disks }}"

- name: Success message
  ansible.builtin.debug:
    msg:
      - "Successfully exported {{ import_from_hypervisor_disks | length }} disk(s) of {{ import_from_hypervisor_instance_name }}"
      - "Disks: {{ import_from_hypervisor_disks | map(attribute='disk_name') | list }}"
      - "Ports: {{ import_from_hypervisor_disks | map(attribute='port') | list }}"
