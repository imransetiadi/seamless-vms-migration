---
# Inputs of the warm playbooks (SDD 6.5). The variable names are part of
# the contract with the Seamless control plane and keep the os_migrate_
# prefix of the collection, hence the var-naming exceptions.

# blocksync chunk size in bytes and read-ahead hashing threads per host.
os_migrate_warm_chunk_size: 4194304  # noqa: var-naming[no-role-prefix]
os_migrate_warm_workers: 4  # noqa: var-naming[no-role-prefix]
# Rollback: also delete the destination volumes and empty the warm state.
os_migrate_rollback_delete_dest_volumes: false  # noqa: var-naming[no-role-prefix]
# false: the rollback leaves the source as it is (the cleanup before a cold cutover, SDD 7)
os_migrate_rollback_start_source: true  # noqa: var-naming[no-role-prefix]
# false: the rollback deletes no destination port (a cancel's cleanup, SDD 5.1)
os_migrate_rollback_delete_ports: true  # noqa: var-naming[no-role-prefix]
# Seconds between the reads while Nova still stops a source server, before the cutover stops it
# or the rollback starts it (SDD 6.5); the cold role's include takes the same default.
os_migrate_source_stop_poll_s: 5  # noqa: var-naming[no-role-prefix]
# Rollback with the catch-all workload filter (every workload of the data dir):
# refused unless this confirms it.
os_migrate_rollback_all: false  # noqa: var-naming[no-role-prefix]

# Optional tuning.
# Disks of one workload synchronised at the same time.
os_migrate_warm_parallel_disks: 4  # noqa: var-naming[no-role-prefix]
# Do not read destination volumes created by the first pass (assume they
# are zero-filled). Only safe on backends that return zeros for blocks
# never written (Ceph RBD, thin LVM, sparse files).
os_migrate_warm_assume_zero: false  # noqa: var-naming[no-role-prefix]
# Extent tracking (Seamless Migrate SDD 28): the pre-copy passes check the extents of each disk
# with a base ("off" or check), and the final pass reads them alone after a clean check ("off" or
# read). Quoted: YAML reads a bare off as false.
os_migrate_warm_extents_precopy: "off"  # noqa: var-naming[no-role-prefix]
os_migrate_warm_extents_final: "off"  # noqa: var-naming[no-role-prefix]
# The run's Ceph files and user for the extent queries, and the tracked pools (Cinder pool to
# Ceph pool); the control plane writes them per run.
os_migrate_warm_ceph_conf: ""  # noqa: var-naming[no-role-prefix]
os_migrate_warm_ceph_keyring: ""  # noqa: var-naming[no-role-prefix]
os_migrate_warm_ceph_client: seamless  # noqa: var-naming[no-role-prefix]
os_migrate_warm_ceph_pools: {}  # noqa: var-naming[no-role-prefix]
os_migrate_warm_extent_query_timeout: 300  # noqa: var-naming[no-role-prefix]
# Keep the serialized volume_type of destination volumes (after mapping it to
# a destination type in the workload data) instead of the destination default.
os_migrate_workloads_preserve_volume_type: false  # noqa: var-naming[no-role-prefix]
# Python 3.6+ on the conversion hosts (e.g. /usr/libexec/platform-python on RHEL 8).
os_migrate_warm_python_interpreter: python3  # noqa: var-naming[no-role-prefix]
# Warm state files: {{ os_migrate_warm_state_dir }}/{source_server_id}.json
os_migrate_warm_state_dir: "{{ os_migrate_data_dir }}/workload_warm"  # noqa: var-naming[no-role-prefix]
# Rollback of a workload without a warm state file (one migrated before
# anything was recorded for it): delete the only destination server named
# exactly like the workload.
os_migrate_rollback_match_by_name: false  # noqa: var-naming[no-role-prefix]

# Standard os-migrate variables, with the defaults of import_workloads
# and conversion_host.
os_migrate_conversion_keypair_private_path: "{{ os_migrate_data_dir }}/conversion/ssh.key"  # noqa: var-naming[no-role-prefix]
os_migrate_conversion_host_ssh_user: cloud-user  # noqa: var-naming[no-role-prefix]
# each conversion host's own SSH user, upstream's single one unless set (Seamless Migrate SDD 6.5)
os_migrate_src_conversion_host_ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"  # noqa: var-naming[no-role-prefix]
os_migrate_dst_conversion_host_ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"  # noqa: var-naming[no-role-prefix]
os_migrate_src_conversion_host_name: os_migrate_conv_src  # noqa: var-naming[no-role-prefix]
os_migrate_dst_conversion_host_name: os_migrate_conv_dst  # noqa: var-naming[no-role-prefix]
os_migrate_timeout: 1800  # noqa: var-naming[no-role-prefix]
os_migrate_workload_cleanup_on_failure: true  # noqa: var-naming[no-role-prefix]
os_migrate_workload_boot_volume_prefix: os-migrate-  # noqa: var-naming[no-role-prefix]
os_migrate_workloads_filter:  # noqa: var-naming[no-role-prefix]
  - regex: .*

# Each run makes its own link between the conversion hosts and removes it when it ends
# (Seamless Migrate SDD 6.4, 26.6): false keeps upstream's static link of the deploy.
os_migrate_conversion_link_per_run: false  # noqa: var-naming[no-role-prefix]
# Seconds after a link is made when the source host's sshd stops accepting its key: the step
# timeout of the run, else 7 days.
os_migrate_conversion_link_expiry_s: 604800  # noqa: var-naming[no-role-prefix]

# Set by the playbooks: precopy, cutover or rollback.
import_workloads_warm_action: precopy
