---
galaxy_info:
  author: os-migrate
  role_name: import_workloads_warm
  description: Warm (pre-copy + delta sync) migration of OpenStack workloads
  company: Red Hat
  license: Apache-2.0
  min_ansible_version: "2.16"
  platforms:
    - name: EL
      versions:
        - "9"
  galaxy_tags: ["osmigrate"]
dependencies:
  - role: os_migrate.os_migrate.prelude_src
  - role: os_migrate.os_migrate.prelude_dst
  - role: os_migrate.os_migrate.validate_resource_files
    vars:
      resource_files:
        - "{{ os_migrate_data_dir }}/workloads.yml"
