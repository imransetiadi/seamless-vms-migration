# gitleaks configuration (Security.md §12): the default rules plus paths that are
# never secrets - git-ignored generated files and Python bytecode caches.
[extend]
useDefault = true

[allowlist]
description = "git-ignored local secrets files and bytecode caches"
paths = [
  'deploy/compose/\.env$',
  'deploy/compose/tokens\.yaml$',
  '__pycache__/',
  # redaction test fixtures: fake tokens that the redactor must strip (seamless/tests/test_memory.py)
  'seamless/tests/test_memory\.py$',
  # write-only key upload fixtures: syntactically shaped OpenSSH keys without key material ("A" * 64 or the
  # bare "openssh-key-v1" header repeated) that must never appear in responses, events or the DB
  'seamless/tests/test_api_core\.py$',
  'seamless/tests/test_provider_management\.py$',
  'dashboard/src/pages/Providers\.test\.tsx$',
]
