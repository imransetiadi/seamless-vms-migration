# CodeQL static analysis of the control plane (Python) and the dashboard (JavaScript/TypeScript):
# the semantic scanner the nightly dependency and configuration scans of ci.yml do not provide
# (Security.md §9.2, audit F-04). Findings land in the repository's Security tab; the workflow
# never blocks a pull request on its own.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1" # weekly, after the nightly scans (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            paths: seamless/src
          - language: javascript-typescript
            paths: dashboard/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # the analysed trees: the tests, fixtures and the inherited collection are scanned by their
          # own linters and sanity jobs
          config: |
            paths:
              - ${{ matrix.paths }}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
