# Seamless Migrate CI (QASuite §13: unit suites on every push, scans S-17…S-20 nightly and on
# release candidates). Lab (E3) cases are not run here: they need the reference lab (QASuite §7).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly scans (UTC)
  workflow_dispatch:

permissions:
  contents: read

# a push to main must not cancel the nightly scans (nor the nightly a push): one group per event kind;
# only pull-request runs are superseded by a newer push to the same branch (audit D-13)
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  control-plane:
    name: control plane (py${{ matrix.python }}, SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seamless
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: seamless_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seamless -d seamless_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: seamless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: seamless/pyproject.toml
      - name: Install
        run: |
          # setuptools is upgraded too: the runner's default copy carries PYSEC-2026-3447 (S-18)
          python -m pip install --upgrade pip "setuptools>=83"
          # ansible-core: tests/test_failure_classification.py runs the collection's real export module in a
          # subprocess (review RV8-05); the same line the collection job and the image pin
          python -m pip install -e ".[dev,jev,openstack,vmware]" "ansible-core>=2.16,<2.19" pytest-cov pip-audit
      - name: Lint (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Unit and integration tests with the coverage gate (NFR-11)
        env:
          SEAMLESS_TEST_PG_URL: postgresql+psycopg://seamless:ci-only@127.0.0.1:5432/seamless_test
        run: pytest -q --cov=seamless_migrate --cov-report=term --cov-fail-under=85
      - name: DEMO-07 on a throwaway demo server (QASuite §6.6, §14.7)
        # about 15 s: a hang fails this step, not the job's whole time budget
        timeout-minutes: 5
        # the runner's Python holds the control plane, not a venv: its seamless is on PATH
        run: SEAMLESS=seamless ../tests/e2e/demo-cutover-refusal.sh
      - name: Dependency audit (S-18)
        run: pip-audit --progress-spinner off

  collection:
    name: collection (warm path, lint, syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install ansible-core and the test tools
        run: |
          python -m pip install --upgrade pip
          # openstacksdk: prelude_common checks its version at the start of every playbook
          python -m pip install "ansible-core>=2.16,<2.19" ansible-lint pytest pytest-mock pyyaml "openstacksdk>=4.5"
      - name: Lay the repository out as ansible_collections/os_migrate/os_migrate
        run: |
          mkdir -p "$RUNNER_TEMP/colltree/ansible_collections/os_migrate"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/colltree/ansible_collections/os_migrate/os_migrate"
          echo "PYTHONPATH=$RUNNER_TEMP/colltree" >> "$GITHUB_ENV"
          echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/colltree" >> "$GITHUB_ENV"
      - name: Collection unit tests (all of tests/unit, including the security fixes; no skips)
        working-directory: ${{ runner.temp }}/colltree/ansible_collections/os_migrate/os_migrate
        run: |
          python plugins/module_utils/blocksync.py --help > /dev/null
          # every file, not a list: SEC-01/03/05 regression tests live outside the warm path
          pytest -q -rs tests/unit > "$RUNNER_TEMP/unit.txt" 2>&1 || { cat "$RUNNER_TEMP/unit.txt"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/unit.txt"
          if grep -qE '[0-9]+ skipped' "$RUNNER_TEMP/unit.txt"; then echo "unexpected skipped tests"; exit 1; fi
      - name: ansible-test sanity on the collection, as upstream runs it, from a copied tree (QASuite §14.2)
        run: scripts/collection-sanity.sh
      - name: Playbook syntax checks
        run: |
          for pb in import_workloads.yml import_workloads_precopy.yml import_workloads_cutover.yml \
                    rollback_workloads.yml import_from_hypervisor.yml; do
            ansible-playbook --syntax-check -i inventory/localhost.yml "playbooks/$pb"
          done
      - name: ansible-lint (production profile) on the new roles and playbooks
        run: |
          ansible-lint --offline roles/import_workloads_warm roles/import_from_hypervisor \
            playbooks/import_workloads_precopy.yml playbooks/import_workloads_cutover.yml \
            playbooks/rollback_workloads.yml
      - name: Build the collection tarball a release attaches, from the tracked files (audit D-04)
        # the same recipe as the image (seamless/Containerfile): the openstack.cloud modules the roles
        # call are vendored from the pinned Galaxy release, then ansible-galaxy packs the tree under
        # galaxy.yml's build_ignore. Nothing upstream-controlled runs here (make build uses upstream's
        # builder image); the artifact is what RELEASING.md attaches to a GitHub Release.
        run: |
          work="$RUNNER_TEMP/collection-build"
          mkdir -p "$work/src" "$work/dist"
          git ls-files -z | rsync -a --from0 --files-from=- ./ "$work/src/"
          os_cloud=$(grep -oE 'OS_CLOUD_VERSION=[0-9.]+' seamless/Containerfile | cut -d= -f2)
          ansible-galaxy collection install "openstack.cloud:${os_cloud}" -p "$work/galaxy"
          scripts/vendor-openstack-cloud.sh "$work/src" "$work/galaxy/ansible_collections/openstack/cloud/plugins"
          (cd "$work/src" && ansible-galaxy collection build --force --output-path "$work/dist")
          ls -l "$work/dist"
          tar tzf "$work/dist"/os_migrate-os_migrate-*.tar.gz | grep -q '^NOTICE$'
          if tar tzf "$work/dist"/os_migrate-os_migrate-*.tar.gz | grep -qE 'docs/audits|AUDIT-'; then
            echo "audit material in the artifact"; exit 1
          fi
          echo "COLLECTION_DIST=$work/dist" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-tarball
          path: ${{ env.COLLECTION_DIST }}/os_migrate-os_migrate-*.tar.gz
          retention-days: 30

  dashboard:
    name: dashboard (typecheck, lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production dependency audit (S-18)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  dashboard-e2e:
    name: dashboard browser smoke (Playwright, mock mode), DEMO-07 and maker-checker from the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      # the dashboard's Playwright config runs Chromium and WebKit (SDD §16, the 2026-10-29 UI audit's WebKit findings)
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright smoke against the mock-mode build (real CSS pipeline)
        run: npm run test:e2e
      - name: Build the dashboard a demo server serves
        run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: seamless/pyproject.toml
      - name: Install the control plane
        working-directory: seamless
        run: python -m pip install -e .
      - name: DEMO-07 from the dashboard on a throwaway demo server (QASuite §6.6, §14.7)
        # about 15 s: a hang fails this step, not the job's whole time budget
        timeout-minutes: 5
        env:
          SHOT_DIR: ${{ runner.temp }}/demo07
        # the runner's Python holds the control plane, not a venv: its seamless is on PATH
        run: mkdir -p "$SHOT_DIR" && SEAMLESS=seamless node ../tests/e2e/demo-cutover-refusal-browser.mjs
      - name: Maker-checker from the dashboard on a throwaway demo server (QASuite §14.7)
        # about 25 s: a requester and an approver of their own, on an auth-enabled server
        timeout-minutes: 5
        env:
          SHOT_DIR: ${{ runner.temp }}/demo07
        run: mkdir -p "$SHOT_DIR" && SEAMLESS=seamless node ../tests/e2e/demo-approval-browser.mjs
      - name: Signing in and out from the dashboard on a throwaway demo server (QASuite §14.7)
        # about 10 s: a viewer and an admin, a token revoked by a restart, then authentication off
        timeout-minutes: 5
        env:
          SHOT_DIR: ${{ runner.temp }}/demo07
        run: mkdir -p "$SHOT_DIR" && SEAMLESS=seamless node ../tests/e2e/demo-signin-browser.mjs
      - name: Planning and starting by keyboard alone on a throwaway demo server (QASuite §14.7)
        # about 15 s: the skip link, a dialog's focus trap, Validate and Start, and a visible focus at every stop
        timeout-minutes: 5
        env:
          SHOT_DIR: ${{ runner.temp }}/demo07
        run: mkdir -p "$SHOT_DIR" && SEAMLESS=seamless node ../tests/e2e/demo-keyboard-browser.mjs
      - name: The event stream across a dropped connection and a server restart on a throwaway demo server (QASuite §14.7)
        # about 20 s: live events with no reload, Reconnecting… and Live again, the events written meanwhile listed once
        timeout-minutes: 5
        env:
          SHOT_DIR: ${{ runner.temp }}/demo07
        run: mkdir -p "$SHOT_DIR" && SEAMLESS=seamless node ../tests/e2e/demo-stream-browser.mjs
      - name: The Overview's key metrics and phase distribution against /stats on a throwaway demo server (QASuite §14.7)
        # about 10 s: every key metric and phase row equals GET /stats, the Rolled back tile, a plan's scope
        timeout-minutes: 5
        env:
          SHOT_DIR: ${{ runner.temp }}/demo07
        run: mkdir -p "$SHOT_DIR" && SEAMLESS=seamless node ../tests/e2e/demo-overview-browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            ${{ runner.temp }}/demo07
          retention-days: 7

  security:
    name: secrets and configuration scans (S-17, S-20)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (tree and history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1" # the pre-commit hook's rev and the laptops' version (audit D-08)
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: trivy config on the deployment manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: "1"

  manifests:
    name: OpenShift manifests (kustomize build + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform (checksum-pinned release)
        run: |
          curl -sSLf -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar xzf kubeconform.tar.gz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render the OpenShift kustomization and validate against the Kubernetes 1.30 schemas
        # Route (route.openshift.io) has no public JSON schema: kustomize parses it, kubeconform skips it
        run: |
          kubectl kustomize deploy/openshift > /tmp/manifests.yaml
          kubeconform -strict -summary -skip Route -kubernetes-version 1.30.0 \
            -schema-location default /tmp/manifests.yaml
      - name: Render the Kubernetes overlay and validate it (no Route; every patch applied)
        # kustomize ignores a patch whose target matches nothing: assert what each patch must produce
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/k8s.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location default /tmp/k8s.yaml
          # `! grep` never fails a step under bash -e: refuse explicitly
          if grep -q '^kind: Route' /tmp/k8s.yaml; then echo "a Route is left in the overlay"; exit 1; fi
          grep -q '^kind: Ingress' /tmp/k8s.yaml
          [ "$(grep -c 'runAsUser:' /tmp/k8s.yaml)" -eq 2 ]
          grep -q 'k8s-app: kube-dns' /tmp/k8s.yaml
          grep -q 'kubernetes.io/metadata.name: ingress-nginx' /tmp/k8s.yaml
          grep -q 'cidr: 10.96.0.1/32' /tmp/k8s.yaml
          # both egress policies except the cluster's pod and service networks, none OpenShift's
          [ "$(grep -c -- '- 10.244.0.0/16' /tmp/k8s.yaml)" -eq 2 ]
          if grep -q -e '10.128.0.0/14' -e '172.30.0.0/16' /tmp/k8s.yaml; then
            echo "OpenShift networks are left in the egress policies"; exit 1
          fi
          grep -q 'image: quay.io/sclorg/postgresql-16-c9s@sha256:' /tmp/k8s.yaml
      - name: Render the optional backup overlay and validate it with the restore job (audit D-06)
        run: |
          kubectl kustomize deploy/openshift/backup > /tmp/backup.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location default \
            /tmp/backup.yaml deploy/openshift/backup/restore-job.yaml
          grep -q '^kind: CronJob' /tmp/backup.yaml
          [ "$(grep -c '^kind: NetworkPolicy' /tmp/backup.yaml)" -eq 2 ]
      - name: Compose files parse with a dummy environment (QASuite §13.5 nightly validation, audit D-14)
        run: |
          dummy=$(mktemp) && printf 'POSTGRES_PASSWORD=x\nJEV_MCP_AUTH_TOKEN=x\n' > "$dummy"
          docker compose -f deploy/compose/compose.yaml --env-file "$dummy" --profile '*' config -q
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.linux-host.yaml \
            --env-file "$dummy" --profile '*' config -q
      # static checks cannot see what an image writes when it starts: the PostgreSQL StatefulSet passed them
      # and still exited 1 under readOnlyRootFilesystem (QASuite §14.5)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: PostgreSQL under the manifests' security context (read-only root, OpenShift and overlay UIDs)
        run: |
          python -m pip install pyyaml
          PYTHON=python scripts/check-readonly-runtime.sh

  image:
    name: container image (build, trivy, SBOM)
    # heavy: the UBI errata and the Galaxy downloads take minutes — main, nightly and manual runs only
    if: github.event_name != 'pull_request'
    needs: [control-plane, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
      - name: Build
        run: docker build -f seamless/Containerfile -t seamless-migrate:ci --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" .
      - name: Smoke the image (demo mode on SQLite; /health is public, everything else needs a token)
        run: |
          docker run -d --name smoke -p 127.0.0.1:18080:8080 -e SEAMLESS_DEMO=true \
            seamless-migrate:ci serve
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"db":"ok"'
          docker logs smoke | tail -20
          docker rm -f smoke
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: The image under the Deployment's security context (read-only root, OpenShift and overlay UIDs)
        run: |
          python -m pip install pyyaml
          SKIP_POSTGRES=1 CP_IMAGE=seamless-migrate:ci PYTHON=python scripts/check-readonly-runtime.sh
      - name: trivy image — fixable HIGH/CRITICAL must be zero (S-19)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: seamless-migrate:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: seamless-migrate:ci
          scan-type: image
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  deploy-scripts:
    name: deploy scripts on ${{ matrix.name }} (compose-init.sh, the Make targets on Linux)
    # SDD §17.1: a Linux host runs the stack on its own Docker Engine with no Colima. These distributions' tools
    # (bash, coreutils, make, openssl) run the init script and the targets' dry runs; Debian and Ubuntu leave
    # openssl out, so the init script's /dev/urandom fallback runs too. RHEL 9 and 10 run as Red Hat's UBI images,
    # RHEL's freely redistributable base with the same tools (QASuite §14.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "RHEL 9 (UBI)", image: "registry.access.redhat.com/ubi9/ubi" }
          - { name: "RHEL 10 (UBI)", image: "registry.access.redhat.com/ubi10/ubi" }
          - { name: "rockylinux:9", image: "rockylinux:9" }
          - { name: "almalinux:9", image: "almalinux:9" }
          - { name: "fedora:42", image: "fedora:42" }
          - { name: "debian:12", image: "debian:12" }
          - { name: "ubuntu:24.04", image: "ubuntu:24.04" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Init and dry runs as the README's Linux quick start runs them
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" bash -euo pipefail -c '
            if command -v dnf >/dev/null; then dnf -y -q install make openssl findutils >/dev/null
            else apt-get update -qq && apt-get install -y -qq make >/dev/null; fi
            cp -r /src /work && cd /work
            # the admin token stays in a file of this throwaway container, never in the log
            scripts/compose-init.sh > /tmp/init.out 2> /tmp/init.err
            grep -q "^POSTGRES_PASSWORD=" deploy/compose/.env
            [ "$(stat -c %a deploy/compose/.env)" = 600 ] && [ "$(stat -c %a deploy/compose/tokens.yaml)" = 644 ]
            grep -q "sha256: [0-9a-f]\{64\}$" deploy/compose/tokens.yaml
            grep -q "Next steps (this machine'"'"'s Docker Engine)" /tmp/init.err
            make -n --no-print-directory seamless-up > /tmp/up.txt
            grep -q -- "docker --context default " /tmp/up.txt
            grep -q "compose.linux-host.yaml" /tmp/up.txt
            make --no-print-directory seamless-colima-up | grep -q "Colima is not needed on Linux"
            echo "ok on $(. /etc/os-release && echo "$PRETTY_NAME")"
          '

  rhel-control-plane:
    name: control plane on RHEL ${{ matrix.rhel }} (UBI, AppStream Python ${{ matrix.python }})
    # The owner's ask of 2026-10-29: the tools run on RHEL 9 and later. Red Hat's UBI images are RHEL's freely
    # redistributable base with RHEL's AppStream Pythons; the control plane installs from the checkout into a venv of
    # that Python, its CLI answers, and its configuration, store, model and API core tests pass there (QASuite §14.1).
    # RHEL 9 offers Python 3.11 and 3.12 as AppStream packages beside its 3.9; RHEL 10's python3 is 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rhel: "9", image: "registry.access.redhat.com/ubi9/ubi", python: "3.12", packages: "python3.12 python3.12-pip" }
          - { rhel: "10", image: "registry.access.redhat.com/ubi10/ubi", python: "3.12", packages: "python3 python3-pip" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the control plane into the AppStream Python's venv, run its CLI and its tests
        env:
          IMAGE: ${{ matrix.image }}
          PY: ${{ matrix.python }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PY -e PACKAGES "$IMAGE" bash -euo pipefail -c '
            # shellcheck disable=SC2086  # PACKAGES is a space-separated list
            dnf -y -q install $PACKAGES >/dev/null
            cp -r /src /work && cd /work/seamless
            "python$PY" -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -e ".[dev,openstack,vmware,dns]"
            .venv/bin/seamless version
            .venv/bin/python -m pytest -q -p no:cacheprovider \
              tests/test_config.py tests/test_models.py tests/test_store.py tests/test_api_core.py tests/test_lease.py
            echo "ok on $(. /etc/os-release && echo "$PRETTY_NAME") with $(.venv/bin/python --version)"
          '

  compose-linux:
    name: Compose stack on a Linux Docker host (make seamless-demo, no Colima)
    # SDD §17.1: the Make targets on an Ubuntu runner's own Docker Engine with no context variable; the image builds
    # its dashboard (no dashboard/dist in the checkout). Heavy like the image job: main, nightly and manual runs only
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker Engine and its Compose plugin
        run: docker version --format 'Docker Engine {{.Server.Version}}' && docker compose version
      - name: compose-init.sh, and an approver of another user for the smoke test (tokens masked)
        run: |
          umask 077
          scripts/compose-init.sh > "$RUNNER_TEMP/init.out"
          echo "::add-mask::$(grep -o 'smg_[A-Za-z0-9_-]*' "$RUNNER_TEMP/init.out" | head -1)"
          # no agentmemory on the runner: memory disabled (SDD §14.3); no TYPESAFE_API_KEY, so Jev is off too, and
          # the smoke test skips both, saying why
          sed -i '/^SEAMLESS_MEMORY_URL=/d' deploy/compose/.env
          # maker-checker (SDD §5.4): an approver of another user, in tokens.yaml before the stack starts (the file is
          # read at startup), made as compose-init.sh makes the admin's: smg_ + 32 random URL-safe bytes, its SHA-256
          approver="smg_$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          echo "::add-mask::$approver"
          printf '%s\n' "$approver" > "$RUNNER_TEMP/approver.token"
          printf '  - name: approver2\n    role: approver\n    sha256: %s\n' \
            "$(printf '%s' "$approver" | sha256sum | cut -d' ' -f1)" >> deploy/compose/tokens.yaml
      - name: make seamless-demo
        run: make seamless-demo
      - name: The dashboard the image built is served at /
        run: curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - name: The demo smoke test (QASuite §14.6)
        run: |
          TOKEN=$(grep -o 'smg_[A-Za-z0-9_-]*' "$RUNNER_TEMP/init.out" | head -1) \
            APPROVER_TOKEN=$(cat "$RUNNER_TEMP/approver.token") tests/e2e/smoke-demo.sh
      - name: The stack's state and logs
        if: failure()
        run: |
          make seamless-ps || true
          docker logs --tail 200 seamless-seamless-1 || true
      - name: make seamless-down
        if: always()
        run: make seamless-down
