# Dependency updates (Security.md §12 "dependency and image scans run monthly and before releases").
# Grouped, weekly, so a single PR per ecosystem carries the routine bumps; security updates are
# opened immediately regardless of the schedule. A group takes only minor and patch bumps: a major
# (React 19, ESLint 10, TypeScript 7, ...) is a migration with its own PR, so one incompatible major
# no longer turns the whole group's PR red (see the failed group PR #5).
version: 2
updates:
  - package-ecosystem: pip
    directory: /seamless
    schedule:
      interval: weekly
      day: monday
    groups:
      control-plane:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, control-plane]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    groups:
      # react and its types move together: a react major without @types/react does not typecheck
      react-major:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major]
      dashboard:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, dashboard]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /seamless
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, image]

  - package-ecosystem: docker
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, image]

  # the collection's own toolchain: requirements.txt (the openstacksdk fork pin is a git URL Dependabot
  # leaves alone), requirements-tests.txt, requirements-build.txt, requirements-docs.txt (audit D-16)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      collection-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, collection]

  # the collection builder image (builder/Containerfile)
  - package-ecosystem: docker
    directory: /builder
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, image]
