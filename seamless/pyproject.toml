[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seamless-migrate"
version = "0.1.0"
description = "Seamless Migrate control plane: plans, validates, estimates and orchestrates VM migrations to RHOSO 18.0"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Seamless Migrate contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
openstack = ["openstacksdk>=4.5"]
vmware = ["pyvmomi>=8.0"]
jev = ["mcp>=2.3,<3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# what `make seamless-check` needs to run the collection's unit and playbook tests from this venv
collection = [
  "ansible-core>=2.16",
  "ansible-lint>=24",
  "pytest-mock>=3.12",
  "pyyaml>=6",
  "openstacksdk>=4.5",
]

[project.scripts]
seamless = "seamless_migrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seamless_migrate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: talks to real external services (Jev, agentmemory); skipped unless enabled",
  "lab: runs against the reference lab clouds (QASuite §7); skipped unless SEAMLESS_LAB_* is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "ASYNC109", "ASYNC110"]  # polling helpers are fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency/parameter markers are evaluated once by design
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "seamless_migrate.api.deps.require_role",
]
