[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seamless-migrate"
version = "0.4.0-rc.1"
description = "Seamless Migrate control plane: plans, validates, estimates and orchestrates VM migrations to RHOSO 18.0"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Seamless Migrate contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
openstack = ["openstacksdk>=4.21.0"]
vmware = ["pyvmomi>=8.0"]
jev = ["mcp>=2.3,<3"]
# the RFC 2136 DNS swap (SDD §8.4): DNS UPDATE with TSIG
dns = ["dnspython>=2.6"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.17,<0.18",  # the pre-commit hook pins the same line (one formatter style)
  "dnspython>=2.6",  # the RFC 2136 swap's tests run a TSIG-checking DNS server (SDD §8.4)
]
# what `make seamless-check` needs to run the collection's unit and playbook tests from this venv
collection = [
  "ansible-core>=2.16",
  "ansible-lint>=24",
  "pytest-mock>=3.12",
  "pyyaml>=6",
  "openstacksdk>=4.21.0",
]

[project.scripts]
seamless = "seamless_migrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seamless_migrate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# a test still running after 5 minutes prints every thread's traceback: a hang names itself (CI's py3.11
# job once hung at 55 % of the suite until its 30-minute timeout, with no test named)
faulthandler_timeout = 300
markers = [
  "live: talks to real external services (Jev, agentmemory); skipped unless enabled",
  "lab: runs against the reference lab clouds (QASuite §7); skipped unless SEAMLESS_LAB_* is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "ASYNC109", "ASYNC110"]  # polling helpers are fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency/parameter markers are evaluated once by design
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "seamless_migrate.api.deps.require_role",
  "seamless_migrate.api.deps.require_permission",
]
